name: Test API-Football coverage

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Stop when the API secret is not configured
        if: ${{ env.API_FOOTBALL_KEY == '' }}
        run: |
          echo "::error::Add API_FOOTBALL_KEY in repository Settings > Secrets and variables > Actions."
          exit 1

      - name: Compare API-Football with verified UEFA data
        run: node scripts/test_api_football_data.js
