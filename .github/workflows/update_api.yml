name: Update Champions League schedule

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: update-champions-league-schedule
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Stop when the API secret is not configured
        if: ${{ env.FOOTBALL_DATA_TOKEN == '' }}
        run: |
          echo "::error::Add FOOTBALL_DATA_TOKEN in repository Settings > Secrets and variables > Actions."
          exit 1

      - name: Fetch and validate Champions League fixtures
        id: fetch
        run: node scripts/update_champions_league_data.js

      - name: Build search pages and sitemap
        if: ${{ steps.fetch.outputs.updated == 'true' }}
        run: node scripts/build_champions_league_pages.js

      - name: Commit verified changes
        if: ${{ steps.fetch.outputs.updated == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/champions-league.json champions-league calendars/champions-league sitemap.xml
          if git diff --staged --quiet; then
            echo "No verified schedule changes."
          else
            git commit -m "Update Champions League schedule [skip ci]"
            git push
          fi
